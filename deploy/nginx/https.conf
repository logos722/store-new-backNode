limit_req_zone $binary_remote_addr zone=gelion_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gelion_orders:10m rate=5r/m;
log_format gelion '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.gelionaqua.ru;
    ssl_certificate /etc/letsencrypt/live/gelionaqua.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gelionaqua.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://gelionaqua.ru$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gelionaqua.ru;
    ssl_certificate /etc/letsencrypt/live/gelionaqua.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gelionaqua.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    access_log /var/log/nginx/gelion.access.log gelion;
    error_log /var/log/nginx/gelion.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, rather than trusting client-supplied forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    location ~ ^/api/auth(?:/|$) {
        if (-f /opt/gelion/maintenance) { return 503; }
        limit_req zone=gelion_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
    }
    location = /api/orders {
        if (-f /opt/gelion/maintenance) { return 503; }
        limit_req zone=gelion_orders burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
    }
    location /api/ {
        if (-f /opt/gelion/maintenance) { return 503; }
        proxy_pass http://127.0.0.1:5000;
    }
    location = /api/web-vitals {
        proxy_pass http://127.0.0.1:3000;
    }
    location /images/ {
        proxy_pass http://127.0.0.1:5000;
        expires 1d;
    }
    location = /health/ready { proxy_pass http://127.0.0.1:5000; }
    location / { proxy_pass http://127.0.0.1:3000; }
}
